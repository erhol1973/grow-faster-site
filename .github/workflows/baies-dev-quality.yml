name: BAEIS dev quality
on:
  pull_request:
    paths:
      - 'baies-dev/**'
      - 'assets/radar-*'
      - 'scripts/radar-release.cjs'
      - 'assets/member-auth.js'
      - 'assets/baies-dev*'
      - 'img/baies-dev*'
      - 'tests/baies-dev*'
      - 'tests/browser/baies-dev*'
      - 'scripts/baies-dev*'
      - 'playwright.baies-dev.config.cjs'
      - '.github/workflows/baies-dev-quality.yml'
permissions:
  contents: read
concurrency:
  group: baeis-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baeis:
    name: BAEIS dev quality gate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: node --test tests/baies-dev.test.cjs
      - run: npx playwright test --config=playwright.baies-dev.config.cjs
        env:
          HOME: /root
      - run: node scripts/baies-dev-load.cjs
      - run: node scripts/baies-dev-performance.cjs
      - name: Save BAEIS evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: baeis-dev-reports
          path: |
            reports/
            playwright-report/
            test-results/
