name: Dev agent surface guard
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: dev-agent-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  surfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - run: node scripts/agent-guard.mjs check
        env:
          AGENT_DIR: docs/agents
  performance-preflight:
    name: Navigation performance preflight
    # Faster feedback on dev changes; the complete Website quality gate remains mandatory.
    if: startsWith(github.head_ref, 'dev/')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npx playwright test tests/browser/navigation.spec.cjs tests/browser/navigation-accessibility.spec.cjs --project=chromium --project=mobile
        env:
          HOME: /root
      - name: Early homepage mobile measurement
        run: node scripts/performance.cjs --home-only --mobile-only
      - name: Preserve all early homepage samples
        run: cp -R reports/lighthouse reports/lighthouse-home-preflight
      - name: Complete unchanged performance matrix
        run: npm run test:performance
      - name: Save early navigation performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: navigation-performance-preflight
          path: |
            reports/
            playwright-report/
            test-results/
