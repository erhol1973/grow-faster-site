name: Diagnose public domain (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  diagnose:
    name: DNS and GitHub Pages diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect DNS delegation and website records
        shell: bash
        run: |
          for type in NS A AAAA MX CAA; do
            echo "=== grow-faster.be $type ==="
            dig +noall +answer grow-faster.be "$type" || true
          done
          echo "=== www.grow-faster.be CNAME ==="
          dig +noall +answer www.grow-faster.be CNAME || true
          echo "=== parent DS ==="
          dig +noall +answer grow-faster.be DS || true
      - name: Inspect public HTTP response headers
        shell: bash
        run: |
          for url in "https://grow-faster.be/" "https://grow-faster.be/index.html" "https://www.grow-faster.be/" "https://erhol1973.github.io/grow-faster-site/"; do
            echo "=== $url ==="
            curl --silent --show-error --location --max-time 12 --output /dev/null --dump-header - --write-out 'effective_url=%{url_effective} status=%{http_code} ip=%{remote_ip} ssl=%{ssl_verify_result}\n' "$url" || true
          done
      - name: Inspect GitHub Pages metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          url='https://api.github.com/repos/erhol1973/grow-faster-site/pages'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  data=json.loads(r.read())
                  print(json.dumps({k:data.get(k) for k in ('html_url','status','cname','build_type','custom_404','https_enforced','protected_domain_state','pending_domain_unverified_at','https_certificate','public','source')},indent=2))
          except urllib.error.HTTPError as e: print('Pages API HTTP status:',e.code)
          except Exception as e: print('Pages API error:',str(e))
          PY
