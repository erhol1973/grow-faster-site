name: Daily Dutch language audit
on:
  schedule:
    - cron: '7 8 * * *'
      timezone: Europe/Brussels
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nl-language-audit.yml'
      - 'scripts/nl-*.cjs'
      - 'tests/nl-*.test.cjs'
      - 'language/**'
permissions:
  contents: read
concurrency:
  group: nl-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    container:
      # Same locked browser environment as the release gate; no daily apt mirror dependency.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.save.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Prepare failure report
        run: |
          mkdir -p reports/nl-audit
          echo 'Scan failed before completion. See job log. No baseline or production update.' > reports/nl-audit/setup-failure.txt
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: node --test tests/nl-audit.test.cjs
      - name: Verify preinstalled pinned Chromium
        run: node -e "require('node:fs').accessSync(require('playwright').chromium.executablePath(), require('node:fs').constants.X_OK)"
      - run: node --test tests/nl-dom.test.cjs
      - name: Install checksum-pinned own Java toolchain without apt
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 300 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz' -o "$RUNNER_TEMP/nl-java.tar.gz"
          echo "d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c  $RUNNER_TEMP/nl-java.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nl-java"
          tar -xzf "$RUNNER_TEMP/nl-java.tar.gz" -C "$RUNNER_TEMP/nl-java"
          "$RUNNER_TEMP/nl-java/jdk-21.0.13+9/bin/java" -version
      - name: Install verified own LanguageTool 6.6
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 300 https://languagetool.org/download/LanguageTool-6.6.zip -o "$RUNNER_TEMP/LanguageTool.zip"
          echo "53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631  $RUNNER_TEMP/LanguageTool.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nl-engine"
          (cd "$RUNNER_TEMP/nl-engine" && "$RUNNER_TEMP/nl-java/jdk-21.0.13+9/bin/jar" --extract --file "$RUNNER_TEMP/LanguageTool.zip")
          "$RUNNER_TEMP/nl-java/jdk-21.0.13+9/bin/java" -Xmx1536m -cp "$RUNNER_TEMP/nl-engine/LanguageTool-6.6/languagetool-server.jar" org.languagetool.server.HTTPServer --port 18081 > reports/nl-audit/engine.log 2>&1 &
          echo $! > "$RUNNER_TEMP/nl-engine.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/v2/languages > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Scan Dutch text changes
        run: node scripts/nl-audit.cjs
      - name: Summarize incomplete scan
        if: always()
        shell: bash
        run: |
          mkdir -p reports/nl-audit
          if [ ! -f reports/nl-audit/report.json ]; then
            echo 'Scan failed before a complete report; see GitHub job log. Baseline and production unchanged.' > reports/nl-audit/setup-failure.txt
            echo '## Nederlandse taalcontrole — MISLUKT' >> "$GITHUB_STEP_SUMMARY"
            echo 'De scan kon niet worden voltooid. Zie logs en artifact. Register en productie ongewijzigd.' >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f reports/nl-audit/setup-failure.txt
            cat reports/nl-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: save
        if: always()
        with:
          name: nl-language-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/nl-audit/
          retention-days: 90
          if-no-files-found: error
      - name: Stop own engine
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/nl-engine.pid" ]; then kill "$(cat "$RUNNER_TEMP/nl-engine.pid")" || true; fi
  report-bootstrap-failure:
    needs: scan
    if: always() && needs.scan.result == 'failure' && needs.scan.outputs.artifact_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A container-pull failure happens before scan steps can emit their normal artifact.
      - name: Preserve missing setup report
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/nl-audit
          printf 'Taak mislukt zonder hoofdartifact. Zie het scan-joblog. Bron: %s. Geen betrouwbare scanuitkomst; baseline en productie ongewijzigd.\n' "$SOURCE_SHA" > reports/nl-audit/bootstrap-failure.txt
          echo '## Nederlandse taalcontrole — MISLUKT vóór volledige rapportage' >> "$GITHUB_STEP_SUMMARY"
          cat reports/nl-audit/bootstrap-failure.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nl-language-audit-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/nl-audit/
          retention-days: 90
          if-no-files-found: error
