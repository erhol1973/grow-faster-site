name: Website release
on:
  pull_request:
  push:
    branches: [main, dev/member-access]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  buildprep:
    name: Prepare tested website
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - name: Preserve the exact public build including hidden files
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > tested-website.files.sha256
          tar -cf tested-website.tar dist
          sha256sum tested-website.tar > tested-website.tar.sha256
      - name: Save the single build for all test partitions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-website
          path: |
            tested-website.tar
            tested-website.tar.sha256
            tested-website.files.sha256
          if-no-files-found: error
  typography:
    name: Typography (${{ matrix.profile }})
    needs: buildprep
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [firefox, webkit, mobile-webkit, chromium, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deep member-reader fixtures reuse the pinned historical archive.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the current run's tested website
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tested-website
      - name: Verify and restore the single build
        run: |
          sha256sum --check tested-website.tar.sha256
          tar -xf tested-website.tar
      - name: Verify preinstalled Playwright browsers
        run: |
          node -e "const p = require('playwright'); for (const name of ['chromium', 'firefox', 'webkit']) require('node:fs').accessSync(p[name].executablePath(), require('node:fs').constants.X_OK)"
      - name: Audit typography and reachable states
        run: npm run test:e2e -- tests/browser/typography.spec.cjs tests/browser/typography-states.spec.cjs --project=${{ matrix.profile }}
        env:
          HOME: /root
      - name: Verify tests preserved every public artifact byte
        run: |
          sha256sum --check tested-website.files.sha256
          test "$(find dist -type f | wc -l)" -eq "$(wc -l < tested-website.files.sha256)"
          test -z "$(find dist ! -type f ! -type d -print -quit)"
      - name: Save typography reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typography-reports-${{ matrix.profile }}
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
  journey:
    name: Decision journey
    needs: buildprep
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the current run's tested website
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tested-website
      - name: Verify and restore the single build
        run: |
          sha256sum --check tested-website.tar.sha256
          tar -xf tested-website.tar
      - name: Verify preinstalled Playwright browsers
        run: |
          node -e "const p = require('playwright'); for (const name of ['chromium', 'firefox', 'webkit']) require('node:fs').accessSync(p[name].executablePath(), require('node:fs').constants.X_OK)"
      - name: Verify the integrated journey on all five profiles
        run: npm run test:e2e -- tests/browser/decision-journey
        env:
          HOME: /root
      - name: Verify tests preserved every public artifact byte
        run: |
          sha256sum --check tested-website.files.sha256
          test "$(find dist -type f | wc -l)" -eq "$(wc -l < tested-website.files.sha256)"
          test -z "$(find dist ! -type f ! -type d -print -quit)"
      - name: Save journey reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-journey
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
  checks:
    name: Website quality gate
    needs: [buildprep, typography, journey]
    if: always()
    runs-on: ubuntu-24.04
    container:
      # Keep the image version aligned with the locked Playwright dependency.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 45
    steps:
      - name: Require the tested build before collecting base evidence
        env:
          BUILD_RESULT: ${{ needs.buildprep.result }}
        run: test "$BUILD_RESULT" = success
      # Action commits verified against their official release pages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/agent-guard.mjs check
        env:
          AGENT_MAP: docs/AGENT-SURFACES.md
          AGENT_DIR: docs/agents
          # Git ownership differs inside the container; trust this checkout only.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      - name: Download the current run's tested website
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tested-website
      - name: Verify and restore the single build
        run: |
          sha256sum --check tested-website.tar.sha256
          tar -xf tested-website.tar
      - run: npm test
      - run: npm run security
      - name: Dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Verify preinstalled Playwright browsers
        run: |
          node -e "const p = require('playwright'); for (const name of ['chromium', 'firefox', 'webkit']) require('node:fs').accessSync(p[name].executablePath(), require('node:fs').constants.X_OK)"
          node scripts/verify-browser-runtime.cjs
      - run: npm run test:e2e
        env:
          # Typography and journey have mandatory partitions over the same build.
          TEST_E2E_PARTITION: base
          # Firefox requires a home directory owned by the container user.
          HOME: /root
      - run: npm run test:load
      - name: Lighthouse mobile and desktop medians
        run: npm run test:performance
      - name: Verify tests preserved every public artifact byte
        run: |
          sha256sum --check tested-website.files.sha256
          test "$(find dist -type f | wc -l)" -eq "$(wc -l < tested-website.files.sha256)"
          test -z "$(find dist ! -type f ! -type d -print -quit)"
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-base
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
      # Collect base evidence even when another partition fails. This final
      # mandatory assertion still blocks packaging and the protected release.
      - name: Require every build, typography and journey partition to succeed
        if: always()
        env:
          BUILD_RESULT: ${{ needs.buildprep.result }}
          TYPOGRAPHY_RESULT: ${{ needs.typography.result }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
        run: test "$BUILD_RESULT" = success && test "$TYPOGRAPHY_RESULT" = success && test "$JOURNEY_RESULT" = success
      - name: Package tested website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist
  secrets:
    name: Secrets history gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: '8.24.3'
      - name: Verify narrow language metadata exception with real scanner
        if: always()
        run: node scripts/nl-secret-guard.cjs
        env:
          GITLEAKS_BIN: /tmp/gitleaks-8.24.3/gitleaks
  codeql:
    name: JavaScript security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - tests
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: codeql-results
      - name: Block security findings
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          let count = 0;
          const files = fs.readdirSync('codeql-results').filter(f => f.endsWith('.sarif'));
          if (!files.length) throw new Error('CodeQL produced no SARIF report');
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync('codeql-results/' + file, 'utf8'));
            for (const run of data.runs || []) count += (run.results || []).filter(r => r.level !== 'none' && !(r.suppressions || []).some(s => s.status === 'accepted')).length;
          }
          if (count) throw new Error(`${count} CodeQL findings require review before release`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-results
          path: codeql-results/
  deploy:
    name: Deploy tested website
    needs: [checks, codeql, secrets]
    # Protected main deploys only the artifact that passed all three gates.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.PAGES_RELEASE_ENABLED == 'true' || github.event.head_commit.message == 'Release approved Grow Faster logo')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  production-smoke:
    name: Verify public release
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      # Same locked browsers as the pre-release gate; no apt/CDN browser install.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify preinstalled Chromium launches
        id: runtime
        run: node scripts/verify-browser-runtime.cjs
      - run: npm run verify:production
        id: smoke
      - name: Single public mobile speed measurement
        id: speed
        run: node scripts/performance.cjs --production
      - name: Record public verification outcomes
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          SPEED_OUTCOME: ${{ steps.speed.outcome }}
        run: |
          mkdir -p reports
          printf 'Job: %s\nBrowser runtime: %s\nPublic smoke: %s\nPublic speed observation: %s\n' "$JOB_STATUS" "$RUNTIME_OUTCOME" "$SMOKE_OUTCOME" "$SPEED_OUTCOME" > reports/public-verification-status.txt
          cat reports/public-verification-status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save public verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verification
          path: reports/
