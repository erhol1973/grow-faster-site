name: Website release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Website quality gate
    runs-on: ubuntu-24.04
    container:
      # Keep the image version aligned with the locked Playwright dependency.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 45
    steps:
      # Action commits verified against their official release pages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run security
      - name: Dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Verify preinstalled Playwright browsers
        run: |
          node -e "const p = require('playwright'); for (const name of ['chromium', 'firefox', 'webkit']) require('node:fs').accessSync(p[name].executablePath(), require('node:fs').constants.X_OK)"
      - run: npm run test:e2e
      - run: npm run test:load
      - name: Lighthouse mobile and desktop medians
        run: npm run test:performance
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
      - name: Package tested website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist
  secrets:
    name: Secrets history gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
  codeql:
    name: JavaScript security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - dist
              - tests
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: codeql-results
      - name: Block security findings
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          let count = 0;
          const files = fs.readdirSync('codeql-results').filter(f => f.endsWith('.sarif'));
          if (!files.length) throw new Error('CodeQL produced no SARIF report');
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync('codeql-results/' + file, 'utf8'));
            for (const run of data.runs || []) count += (run.results || []).filter(r => r.level !== 'none' && !(r.suppressions || []).some(s => s.status === 'accepted')).length;
          }
          if (count) throw new Error(`${count} CodeQL findings require review before release`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-results
          path: codeql-results/
  deploy:
    name: Deploy tested website
    needs: [checks, codeql, secrets]
    # Protected main deploys only the artifact that passed all three gates.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.PAGES_RELEASE_ENABLED == 'true' || github.event.head_commit.message == 'Release approved Grow Faster logo')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  production-smoke:
    name: Verify public release
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:production
      - name: Single public mobile speed measurement
        run: node scripts/performance.cjs --production
      - name: Save public verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-verification
          path: reports/

