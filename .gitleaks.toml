# Gitleaks 8.24.3 retains its default rules. Exceptions are constrained by both path and matched content.
# Do not skip a file or disable generic-api-key; unexpected tokens must still fail CI.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated CMS DOM field identifiers in the initial catalog commit (not authentication keys)"
condition = "AND"
paths = ['''(^|/)assets/cms-catalog\.js$''']
regexTarget = "line"
regexes = ['''^\s*"key": "f[a-f0-9]{12,14}-[0-9]+",?\s*$''']

[[rules.allowlists]]
description = "Same verified public CMS DOM identifiers in language-baseline source metadata, not credentials"
condition = "AND"
paths = ['''(^|/)language/nl-baseline\.json$''']
regexTarget = "line"
regexes = ['''^\s*"key": "f[a-f0-9]{12,14}-[0-9]+",?\s*$''']

[[rules.allowlists]]
description = "Supabase public publishable browser key, never a service-role or secret key"
condition = "AND"
paths = ['''(^|/)assets/cms-config\.js$''']
regexTarget = "secret"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]{20,}$''']

[[rules.allowlists]]
description = "Verified public growfaster-test publishable key in the isolated gateway runner; not a credential"
condition = "AND"
paths = ['''(^|/)scripts/accept-cms-storage\.cjs$''']
regexTarget = "secret"
regexes = ['''^sb_publishable_PrzDBgnoLtpUjOLnAM0lfw_up3URiTf$''']

[[rules.allowlists]]
description = "Exact reviewed canonical-LF SHA256 of the public membership source in the Coherence build contract"
condition = "AND"
paths = ['''^scripts/coherence-dictionary\.contract\.json$''']
regexTarget = "line"
regexes = ['''^\s*"member-auth\.js": "fa70b7ab581a623b406ef6ae06aa44570cb6db4ce3c5276c7b5e523737c4df9f",\s*$''']
