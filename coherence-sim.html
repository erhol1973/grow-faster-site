<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coherence Flow Simulation</title>
<meta name="robots" content="noindex">
<style>
body{margin:0}

/* Layout: control bar, BPMN pool (7 lanes) with measuring panel on the right, executive comparison below */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0E1B2C; --navy:#0B2545; --muted:#5B6B80; --line:#D9E1EA; --lane:#F1F4F8; --lane2:#FFFFFF;
  --token:#0A8FD0; --token-soft:rgba(10,143,208,.16); --bad:#A33A3A; --bad-soft:rgba(163,58,58,.10); --good:#0B6E4F; --good-soft:rgba(11,110,79,.10); --visit:#E1F1FA;
  --f-display:"Aptos","Hanken Grotesk","Segoe UI",Helvetica,Arial,sans-serif; --f-mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#101B2D; --ink:#E7EEF7; --navy:#CFE2F7; --muted:#93A4BA; --line:#24344B; --lane:#0E1828; --lane2:#122036;
  --token:#38BDF2; --token-soft:rgba(56,189,242,.18); --bad:#E58A8A; --bad-soft:rgba(229,138,138,.12); --good:#5FD3A8; --good-soft:rgba(95,211,168,.12); --visit:#123552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#101B2D; --ink:#E7EEF7; --navy:#CFE2F7; --muted:#93A4BA; --line:#24344B; --lane:#0E1828; --lane2:#122036;
  --token:#38BDF2; --token-soft:rgba(56,189,242,.18); --bad:#E58A8A; --bad-soft:rgba(229,138,138,.12); --good:#5FD3A8; --good-soft:rgba(95,211,168,.12); --visit:#123552; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
#exec-body{display:grid;gap:24px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5}
.page{max-width:1880px;margin:0 auto;padding-block:4px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(26px,3vw,38px);line-height:1.12;margin:6px 0 8px;color:var(--navy);font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.lede{margin:0;max-width:78ch;color:var(--muted);font-size:16.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.tabs,.ctl,.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;cursor:pointer}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;font-weight:600;font-size:13px;letter-spacing:.04em}
.tab[aria-selected="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;font-weight:600;font-size:13.5px;min-width:44px}
.btn.primary{background:var(--token);border-color:var(--token);color:#fff}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,label.sw:focus-within{outline:2px solid var(--token);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 10px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
label.sw{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;padding:6px 4px}
label.sw input{width:16px;height:16px;accent-color:var(--token)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.stage.compare{grid-template-columns:minmax(0,1fr) 400px}
.diagrams{display:grid;gap:14px;min-width:0}
.dwrap{background:var(--surface);border:1px solid var(--line);min-width:0}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.dhead h2{margin:2px 0 0;font-size:20px;color:var(--navy);font-weight:700}
.dhead p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:80ch}
.scroll{overflow-x:auto}
svg.bpmn{display:block;width:100%;min-width:1080px;height:auto}
.panel{display:grid;gap:14px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
.card{background:var(--surface);border:1px solid var(--line);padding:16px 18px}
.card h3{margin:4px 0 6px;font-size:18px;color:var(--navy);line-height:1.25}
.quote{font-style:italic;color:var(--token);margin:0 0 10px;font-size:14.5px}
.card h4{margin:12px 0 2px;font-size:12px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card p{margin:0;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:3px 7px;border:1px solid var(--line)}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.metrics{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-variant-numeric:tabular-nums;align-items:baseline}
.metrics dt{font-size:14px}
.metrics dd{margin:0;font-weight:700;font-size:18px;color:var(--navy);text-align:right}
.metrics .big{font-size:26px}
.mbar{grid-column:1/-1;height:6px;background:var(--lane);position:relative;margin:-2px 0 6px}
.mbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--token);transition:width .25s}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cmp td.inc{color:var(--bad);font-weight:700}.cmp td.coh{color:var(--good);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);padding:8px 10px;display:grid;gap:2px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--good)}
.kpi.flash{animation:fl .6s}
@keyframes fl{from{background:var(--token-soft)}to{background:transparent}}
.note{font-size:12.5px;color:var(--muted);margin:0}
.result{margin-top:10px;display:grid;gap:2px;text-align:center;font-family:var(--f-mono);letter-spacing:.08em;font-size:12.5px}
.result b{font-size:13.5px;color:var(--navy)}
.result.bad b:last-child{color:var(--bad)}.result.good b:last-child{color:var(--good)}
/* svg */
.lane-bg{fill:var(--lane)}.lane-bg.alt{fill:var(--lane2)}
.lane-line{stroke:var(--line);stroke-width:1}
.lane-head{fill:var(--surface);stroke:var(--line)}
.lane-t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;fill:var(--muted)}
.pool-t{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;fill:var(--navy)}
.edge{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.75}
.edge.back{stroke-dasharray:5 4;stroke:var(--bad);opacity:.8}
.edge.alt{stroke-dasharray:3 4;opacity:.5}
.elabel{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.elabel.back{fill:var(--bad)}
.node rect,.node circle,.node path.gw{fill:var(--surface);stroke:var(--navy);stroke-width:1.3;transition:fill .25s,stroke .25s}
.node text{font-family:var(--f-display);font-size:11.6px;fill:var(--ink);font-weight:500}
.node .tag{font-family:var(--f-mono);font-size:8.6px;letter-spacing:.03em;fill:var(--muted);font-weight:400}
.node .ico{fill:none;stroke:var(--muted);stroke-width:1.2}
.node.end circle{stroke-width:3.2}
.node.visited rect,.node.visited circle,.node.visited path.gw{fill:var(--visit)}
.node.active rect,.node.active circle,.node.active path.gw{stroke:var(--token);stroke-width:2.6;fill:var(--visit)}
.node.active .tag{fill:var(--token)}
.trail{fill:none;stroke:var(--token);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.trail.back{stroke:var(--bad);stroke-dasharray:6 5;opacity:.75}
.token{fill:var(--token);stroke:var(--surface);stroke-width:2.5}
.token.wait{animation:pulse .9s ease-in-out infinite}
.token.back{fill:var(--bad)}
@keyframes pulse{50%{r:15}}
.layer{fill:none;stroke-width:2.5}
.layer.ok{stroke:var(--good)}.layer.broken{stroke:var(--bad);stroke-dasharray:10 9}
.layer-dot{fill:var(--surface);stroke-width:2}
.fan{font-family:var(--f-mono);font-size:10px;fill:var(--good)}
.fan-box{fill:var(--good-soft);stroke:var(--good);stroke-width:1}
.hide-trail .trail{display:none}
.hide-layers .layers{display:none}
/* executive */
.exec{background:var(--surface);border:1px solid var(--line);padding:24px clamp(16px,3vw,32px);display:grid;gap:22px}
.exec h2{margin:4px 0 0;font-size:clamp(22px,2.4vw,30px);color:var(--navy);text-wrap:balance}
.lock{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.lock p{margin:0;color:var(--muted);max-width:70ch}
.twocol{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl thead th{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl td:nth-child(2){color:var(--bad)}.tbl td:nth-child(3){color:var(--good);font-weight:600}
.bars{display:grid;gap:12px}
.brow{display:grid;gap:4px}
.brow .lbl{display:flex;justify-content:space-between;font-size:14px}
.brow .lbl b{font-variant-numeric:tabular-nums}
.btrack{display:grid;gap:3px}
.btrack i{display:block;height:9px}
.btrack i.inc{background:var(--bad)}.btrack i.coh{background:var(--good)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}
.formula{display:grid;gap:6px;text-align:center;padding:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.formula .neq{font-family:var(--f-mono);letter-spacing:.08em;color:var(--muted);font-size:15px}
.formula .eq{font-size:clamp(22px,3vw,34px);font-weight:700;color:var(--navy);letter-spacing:.02em}
.formula .eq em{font-style:normal;color:var(--token)}
.formula p{margin:0;color:var(--muted);font-size:13px}
.formula .claim{color:var(--ink);font-size:16px;max-width:70ch;margin:6px auto 0}
.final{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fcol{border:1px solid var(--line);padding:16px;display:grid;gap:6px;justify-items:center;text-align:center}
.fcol .k{margin-bottom:4px}
.fcol span{font-weight:600}
.fcol .arr{color:var(--muted);font-weight:400}
.fcol.bad span:last-child{color:var(--bad)}.fcol.good span:last-child{color:var(--good)}
.closing{font-size:clamp(19px,2vw,24px);font-weight:700;color:var(--navy);text-align:center;margin:0;text-wrap:balance}
@media (max-width:1180px){.stage,.stage.compare{grid-template-columns:minmax(0,1fr)}.panel{position:static}.twocol{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.final{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.token.wait{animation:none}.kpi.flash{animation:none}}
/* A full-width pool, followed by the explanation and metrics. */
.stage,.stage.compare{grid-template-columns:minmax(0,1fr)}
.page{max-width:none;gap:18px}
.scroll{overflow:visible;min-width:0}
svg.bpmn{width:100%;min-width:0;max-width:100%;height:auto}
.panel{position:static;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);align-items:start}
.stage.compare .panel{grid-template-columns:minmax(0,1fr)}
.panel>.card{min-width:0}
@media(max-width:900px){.panel{grid-template-columns:repeat(2,minmax(0,1fr))}.panel>.card:first-child{grid-column:1/-1}.bar{align-items:flex-start}.tabs,.ctl,.opts{gap:8px}}
@media(max-width:560px){.panel{grid-template-columns:minmax(0,1fr)}.page{padding-inline:8px}.dhead{padding:12px}.card{padding:14px}.bar{padding:10px}.tab{padding:8px;font-size:11px}.tbl{overflow-x:visible}.tbl table{min-width:0;table-layout:fixed}.tbl th,.tbl td{overflow-wrap:anywhere}}
.result-lane{margin-top:20px;padding:20px;background:var(--lane);border:1px solid var(--line)}.result-lane>h4{margin:0 0 16px;font-family:var(--f-display);font-size:15px;letter-spacing:0;font-weight:600;color:var(--navy)}.result-flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}.result-flow li{position:relative;display:grid;align-content:center;gap:8px;padding:16px;min-height:100px;border:1px solid var(--line);border-top:3px solid var(--navy);background:var(--surface);color:var(--navy);font-family:var(--f-display);text-align:left}.result-number{font-size:11px;font-weight:600;color:var(--muted)}.result-flow b{font-size:15px;line-height:1.4}.result-flow li:not(:last-child)::after{content:'→';position:absolute;left:100%;width:32px;top:50%;transform:translateY(-50%);font-size:24px;text-align:center;color:var(--token)}.result-lane.bad .result-outcome{border-top-color:var(--bad);color:var(--bad)}.result-lane.good .result-outcome{border-top-color:var(--good);color:var(--good)}@media(max-width:600px){.result-flow{grid-template-columns:minmax(0,1fr);gap:26px}.result-flow li:not(:last-child)::after{content:'↓';top:100%;left:50%;width:24px;height:26px;line-height:26px;transform:translateX(-50%)}.result-lane{padding:14px}.result-flow li{min-height:76px}}
</style>
</head>
<body>

<div class="page">

  <div class="bar" role="toolbar" aria-label="Simulatie">
    <div class="tabs" role="tablist" aria-label="Weergave">
      <button class="tab" role="tab" id="tab-inc" aria-selected="true" data-view="inc" data-u="tab_inc"></button>
      <button class="tab" role="tab" id="tab-coh" aria-selected="false" data-view="coh" data-u="tab_coh"></button>
      <button class="tab" role="tab" id="tab-cmp" aria-selected="false" data-view="cmp" data-u="tab_cmp"></button>
    </div>
    <div class="ctl">
      <button class="btn primary" id="b-play" type="button">▶ Start</button>
      <button class="btn" id="b-step" type="button" data-u="step"></button>
      <button class="btn" id="b-reset" type="button" data-u="reset"></button>
      <span class="seg" role="group" aria-label="Speed"><button type="button" data-speed="0.5" aria-pressed="false">0,5×</button><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2" aria-pressed="false">2×</button></span>
    </div>
    <div class="opts">
      <label class="sw"><input type="checkbox" id="o-trail" checked> <span data-u="trail"></span></label>
      <label class="sw"><input type="checkbox" id="o-layers"> <span data-u="layers"></span></label>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="diagrams" id="diagrams"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <p class="note" data-u="note"></p>
</div>

eam jumps from the problem straight to an AI solution.", "Process redesign is skipped. The technology sets the approach, not the outcome."], "n3": ["Add AI to the existing process", "AI on top of complexity", "AI becomes an extra layer on top of the existing workflow: manual → AI → manual.", "Waiting and handoffs remain. AI speeds up a task, not the flow."], "n4": ["Collect data", "Data silos", "Data comes from different sources, with duplicates and conflicting definitions.", "Access is missing and nobody owns the data. The use case slows down."], "g1": ["Data available?", "", "Is the required data usable?", "Not the first time: another department has to be contacted."], "n5": ["Contact another department", "Who owns this?", "The team requests data from another department.", "There is no agreed owner. Follow-up happens through email and escalation."], "t1": ["Waiting for data", "", "Waiting for the other department.", "The use case stands still. Nobody manages this waiting time."], "n6": ["Develop AI pilot", "Pilot works", "A local team builds a working pilot with its own prompts, datasets, integrations and vendor.", "It works technically, but almost nothing is reusable."], "n7": ["Privacy / Risk / Security review", "Governance as a gate", "Governance appears only just before production.", "Late findings lead to redesign, extra controls and legal review."], "g2": ["Approved?", "", "Does the pilot meet privacy, risk and security requirements?", "Not the first time. The pilot goes back for rework."], "n8": ["Build point-to-point integration", "Integration complexity", "CRM, ERP, SharePoint and databases are each connected separately.", "Every connection is custom work. Maintenance and risk grow with each use case."], "g3": ["Production ready?", "", "Can the pilot go to production?", "Only after several iterations. Moving from pilot to production is hard."], "n10": ["Employees use the AI tool", "AI beside the work", "Employees get an extra application, an extra login and a new way of working.", "Training and trust are missing. Usage stays limited."], "n11": ["Measure value", "No baseline", "There is no KPI baseline and the business owner is unclear.", "A technically successful pilot, but the business value cannot be shown."], "g4": ["Reusable?", "", "Can another department reuse the solution?", "No, or only partly. Local data, integrations and controls must be rebuilt."], "e1": ["Start again", "", "A new department starts from zero.", "Every next use case follows the same fragmented path."]}, "coh": {"s0": ["Business question"], "c1": ["Define problem, outcome and KPI", "Outcome-first", "The business problem, target outcome, KPI and business owner are set first.", "Every next step steers on the same outcome."], "cg1": ["Is AI the right solution?", "", "An AI suitability assessment: does AI fit this problem?", "AI is not chosen by default. No leads to classic process improvement."], "ca": ["Classic improvement"], "c3": ["Redesign the process end-to-end", "Work redesign", "Decide which steps disappear, which are automated and where people keep deciding.", "AI gets a place in a better process, not on top of the old one."], "p1": ["Parallel", "", "Data and risk are prepared at the same time.", "Parallel work takes waiting time out of the critical path."], "c4": ["Retrieve trusted enterprise data", "Trusted data", "Governed data with metadata, lineage, permissions and consistent definitions.", "No search: the data is findable, reliable and accessible."], "c5": ["AI risk classification", "Governance by design", "Early classification as low, medium or high risk sets the controls.", "Governance is part of the design, not a gate at the end."], "p2": ["Join"], "cg2": ["Autonomy level?", "", "The level of human oversight follows from risk and context.", "More autonomy is not always better: the level matches the risk.", "Human decides · approves · monitors · autonomous within guardrails"], "c7": ["Use AI / agent capability", "Reusable capability", "The agent uses existing identity, knowledge, APIs, monitoring and policies.", "Nothing is rebuilt locally."], "c8": ["Deploy via enterprise AI platform", "Shared platform", "AI gateway, identity, API management, observability, evaluation and monitoring are shared.", "Every new use case reuses the same platform."], "c9": ["AI in the workflow", "AI in the flow of work", "AI works inside CRM, ERP, Teams or ServiceNow. No separate application.", "Employees need to do nothing extra. Adoption follows the work."], "p3": ["Parallel", "", "Measuring outcomes and continuous monitoring happen at the same time.", "Value and risk are followed up together."], "c10": ["Measure business outcome", "Value realization", "KPI, adoption, quality, cycle time, customer impact and risk indicators.", "Value is shown against a baseline set in advance."], "c11": ["Continuous monitoring", "Continuous governance", "Performance, drift, security, policy violations and human overrides are monitored.", "Governance runs along in production instead of blocking at the end."], "p4": ["Join"], "cg3": ["Reusable?", "", "Can the capability serve other use cases?", "Yes. Same data, platform, governance, identity and monitoring."], "ce": ["Value at scale", "", "The capability branches out to new use cases.", "Every next use case starts on an existing foundation."]}}, "nl": {"ui": {"tab_inc": "VOOR · INCOHERENTE ENTERPRISE", "tab_coh": "NA · COHERENTE ENTERPRISE", "tab_cmp": "VERGELIJK", "start": "Start", "pause": "Pauze", "resume": "Verder", "step": "Stap ›", "reset": "↺ Reset", "trail": "Reispad tonen", "layers": "Coherentielagen tonen", "before": "Voor", "after": "Na", "ready": "Klaar om te starten", "stepk": "Stap", "what": "Wat gebeurt hier?", "why_bad": "Waarom is dit een probleem?", "why_good": "Waarom is dit een voordeel?", "impact": "Impact", "hint": "Druk op Start. De bol stelt één AI use case voor.", "measured": "Gemeten reispad", "live": "Gemeten reispad · live", "dist": "Procesafstand", ta. De use case vertraagt."], "g1": ["Data beschikbaar?", "", "Is de nodige data bruikbaar?", "De eerste keer niet: er moet een andere afdeling worden aangesproken."], "n5": ["Andere afdeling contacteren", "Wie is eigenaar?", "Het team vraagt data aan bij een andere afdeling.", "Er is geen afgesproken eigenaar. Opvolging gebeurt per mail en escalatie."], "t1": ["Wachten op data", "", "Wachten op de andere afdeling.", "De use case staat stil. Niemand stuurt op deze wachttijd."], "n6": ["AI pilot ontwikkelen", "Pilot werkt", "Een lokaal team bouwt een werkende pilot met eigen prompts, datasets, integraties en leverancier.", "Technisch werkt het, maar bijna niets is herbruikbaar."], "n7": ["Privacy / Risk / Security review", "Governance als gate", "Governance verschijnt pas vlak voor productie.", "Late bevindingen leiden tot herontwerp, extra controles en juridische review."], "g2": ["Goedgekeurd?", "", "Voldoet de pilot aan privacy, risico en security?", "De eerste keer niet. De pilot gaat terug voor herwerking."], "n8": ["Point-to-point integratie bouwen", "Integration complexity", "CRM, ERP, SharePoint en databases worden elk apart gekoppeld.", "Elke koppeling is maatwerk. Onderhoud en risico groeien met elke use case."], "g3": ["Production ready?", "", "Kan de pilot naar productie?", "Pas na meerdere iteraties. De overgang van pilot naar productie is moeizaam."], "n10": ["Medewerkers gebruiken AI-tool", "AI naast het werk", "Medewerkers krijgen een extra applicatie, met een extra login en een nieuwe werkwijze.", "Training en vertrouwen ontbreken. Het gebruik blijft beperkt."], "n11": ["Waarde meten", "Baseline ontbreekt", "Er is geen KPI-baseline en de business owner is onduidelijk.", "Een technisch geslaagde pilot, maar de bedrijfswaarde is niet aantoonbaar."], "g4": ["Herbruikbaar?", "", "Kan een andere afdeling de oplossing hergebruiken?", "Nee, of beperkt. Lokale data, integraties en controles moeten opnieuw."], "e1": ["Opnieuw beginnen", "", "Een nieuwe afdeling begint van nul.", "Elke volgende use case doorloopt hetzelfde gefragmenteerde pad."]}, "coh": {"s0": ["Bedrijfsvraag"], "c1": ["Probleem, outcome en KPI bepalen", "Outcome-first", "Het businessprobleem, het beoogde resultaat, de KPI en de business owner worden eerst vastgelegd.", "Elke volgende stap stuurt op hetzelfde resultaat."], "cg1": ["Is AI de juiste oplossing?", "", "Een AI suitability assessment: past AI bij dit probleem?", "AI wordt niet automatisch gekozen. Nee leidt naar klassieke procesverbetering."], "ca": ["Klassieke verbetering"], "c3": ["End-to-end proces herontwerpen", "Work redesign", "Bepalen welke stappen verdwijnen, welke geautomatiseerd worden en waar mensen blijven beslissen.", "AI krijgt een plaats in een beter proces, niet bovenop het oude."], "p1": ["Parallel", "", "Data en risico worden tegelijk voorbereid.", "Parallel werk haalt wachttijd uit het kritieke pad."], "c4": ["Trusted enterprise data ophalen", "Trusted data", "Governed data met metadata, lineage, rechten en eenduidige definities.", "Geen zoektocht: de data is vindbaar, betrouwbaar en toegankelijk."], "c5": ["AI risk classification", "Governance by design", "Vroege classificatie als laag, middel of hoog risico bepaalt de controles.", "Governance zit in het ontwerp, niet als poort op het einde."], "p2": ["Samenvoegen"], "cg2": ["Autonomy level?", "", "Het niveau van menselijk toezicht volgt uit risico en context.", "Meer autonomie is niet altijd beter: het niveau past bij het risico.", "Mens beslist · keurt goed · bewaakt · autonoom binnen guardrails"], "c7": ["AI / agent capability inzetten", "Reusable capability", "De agent gebruikt bestaande identity, kennis, API’s, monitoring en policies.", "Er wordt niets lokaal opnieuw gebouwd."], "c8": ["Deploy via enterprise AI platform", "Shared platform", "AI gateway, identity, API-beheer, observability, evaluatie en monitoring zijn gedeeld.", "Elke nieuwe use case hergebruikt hetzelfde platform."], "c9": ["AI in de workflow", "AI in the flow of work", "AI werkt binnen CRM, ERP, Teams of ServiceNow. Geen aparte applicatie.", "Medewerkers hoeven niets extra te doen. Adoptie volgt het werk."], "p3": ["Parallel", "", "Resultaat meten en continu bewaken gebeuren tegelijk.", "Waarde en risico worden samen opgevolgd."], "c10": ["Business outcome meten", "Value realization", "KPI, adoptie, kwaliteit, doorlooptijd, klantimpact en risico-indicatoren.", "Waarde wordt aangetoond tegen een vooraf bepaalde baseline."], "c11": ["Continuous monitoring", "Continuous governance", "Prestaties, drift, security, policy-overtredingen en menselijke overrides worden bewaakt.", "Governance loopt mee in productie in plaats van op het einde te blokkeren."], "p4": ["Samenvoegen"], "cg3": ["Herbruikbaar?", "", "Kan de capability voor andere use cases dienen?", "Ja. Dezelfde data, platform, governance, identity en monitoring."], "ce": ["Value at scale", "", "De capability vertakt naar nieuwe use cases.", "Elke volgende use case start op een bestaande fundering."]}}, "fr": {"ui": {"tab_inc": "AVANT · ENTREPRISE INCOHÉRENTE", "tab_coh": "APRÈS · ENTREPRISE COHÉRENTE", "tab_cmp": "COMPARER", "start": "Démarrer", "pause": "Pause", "resume": "Reprendre", "step": "Étape ›", "reset": "↺ Réinitialiser", "trail": "Afficher le trajet", "layers": "Afficher les couches de cohérence", "before": "Avant", "after": "Après", "ready": "Prêt à démarrer", "stepk": "Étape", "what": "Que se passe-t-il ici ?", "why_bad": "Pourquoi est-ce un problème ?", "why_good": "Pourquoi est-ce un avantage ?", "impact": "Impact", "hint": "Appuyez sur Démarrer. La bille représente un cas d’usage IA.", "measured": "Trajet mesuré", "live": "Trajet mesuré · en direct", "dist": "Distance de processus", "hand": "Transferts entre couloirs", "hand_s": "Transferts", "wait": "Moments d’attente", "rework": "Boucles de reprise", "gates": "Points de décision", "steps": "Étapes de processus", "other_coh": "Flux cohérent", "other_inc": "Flux incohérent", "cmpnote": "{o} pour comparaison : distance {d}, {h} transferts, {w} moments d’attente, {r} boucles de reprise.", "kpis": "Indicateurs (qualitatifs)", "inc": "Incohérent", "coh": "Cohérent", "summary": "Même cas d’usage. La bille incohérente parcourt {x}× plus de distance et revient {r} fois en arrière.", "result": "Résultat", "yes": "Oui", "no": "Non", "newdept": "↺ NOUVEAU SERVICE", "inc_title": "L’IA d’entreprise sans cohérence", "inc_sub": "L’IA est ajoutée à un système d’entreprise fragmenté.", "coh_title": "L’IA d’entreprise avec cohérence", "coh_sub": "L’IA est intégrée dans un système où stratégie, processus, données, gouvernance et technologie sont alignés.", "speed": "Vitesse", "note": "Modèle illustratif. Distance, transferts, attentes et reprises sont mesurés sur le flux BPMN dessiné, pas dans une organisation réelle. La cohérence signifie alignement et interopérabilité, pas centralisation."}, "inc": {"s0": ["Idée"], "n1": ["Cas d’usage IA proposé", "Opportunité locale", "Une unité métier repère une opportunité pour l’IA.", "Il n’existe ni portefeuille d’entreprise, ni priorisation commune, ni hypothèse de valeur."], "n2": ["Choisir une solution IA", "Solution-first", "L’équipe passe directement du problème à une solution IA.", "La refonte du processus est ignorée. La technologie dicte l’approche, pas le résultat."], "n3": ["Ajouter l’IA au processus existant", "L’IA sur la complexité", "L’IA devient une couche supplémentaire sur le flux existant : manuel → IA → manuel.", "Attentes et transferts demeurent. L’IA accélère une tâche, pas le flux."], "n4": ["Collecter les données", "Silos de données", "Les données proviennent de sources différentes, avec des doublons et des définitions divergentes.", "L’accès manque et personne n’est responsable des données. Le cas d’usage ralentit."], "g1": ["Données disponibles ?", "", "Les données nécessaires sont-elles utilisables ?", "Pas la première fois : il faut contacter un autre service."], "n5": ["Contacter un autre service", "Qui en est responsable ?", "L’équipe demande des données à un autre service.", "Aucun responsable n’est désigné. Le suivi se fait par e-mail et par escalade."], "t1": ["Attente des données", "", "Attente de l’autre service.", "Le cas d’usage est à l’arrêt. Personne ne pilote ce temps d’attente."], "n6": ["Développer un pilote IA", "Le pilote fonctionne", "Une équipe locale construit un pilote fonctionnel avec ses propres prompts, jeux de données, intégrations et fournisseur.", "Techniquement, cela fonctionne, mais presque rien n’est réutilisable."], "n7": ["Revue vie privée / risques / sécurité", "La gouvernance comme barrière", "La gouvernance n’apparaît que juste avant la production.", "Des constats tardifs entraînent refonte, contrôles supplémentaires et revue juridique."], "g2": ["Approuvé ?", "", "Le pilote respecte-t-il les exigences de confidentialité, de risque et de sécurité ?", "Pas la première fois. Le pilote repart en reprise."], "n8": ["Construire des intégrations point à point", "Complexité d’intégration", "CRM, ERP, SharePoint et bases de données sont connectés un par un.", "Chaque connexion est du sur-mesure. Maintenance et risque augmentent à chaque cas d’usage."], "g3": ["Prêt pour la production ?", "", "Le pilote peut-il passer en production ?", "Seulement après plusieurs itérations. Passer du pilote à la production est laborieux."], "n10": ["Les employés utilisent l’outil IA", "L’IA à côté du travail", "Les employés reçoivent une application de plus, un identifiant de plus et une nouvelle façon de travailler.", "Formation et confiance font défaut. L’usage reste limité."], "n11": ["Mesurer la valeur", "Pas de référence", "Il n’y a pas de référence KPI et le responsable métier n’est pas clair.", "Un pilote réussi techniquement, mais la valeur métier n’est pas démontrable."], "g4": ["Réutilisable ?", "", "Un autre service peut-il réutiliser la solution ?", "Non, ou en partie seulement. Données, intégrations et contrôles locaux sont à refaire."], "e1": ["Recommencer", "", "Un nouveau service repart de zéro.", "Chaque nouveau cas d’usage suit le même chemin fragmenté."]}, "coh": {"s0": ["Question métier"], "c1": ["Définir problème, résultat et KPI", "Outcome-first", "Le problème métier, le résultat visé, le KPI et le responsable métier sont fixés d’abord.", "Chaque étape suivante vise le même résultat."], "cg1": ["L’IA est-elle la bonne solution ?", "", "Une évaluation de pertinence : l’IA convient-elle à ce problème ?", "L’IA n’est pas choisie par défaut. Non mène à une amélioration classique du processus."], "ca": ["Amélioration classique"], "c3": ["Repenser le processus de bout en bout", "Work redesign", "Décider quelles étapes disparaissent, lesquelles sont automatisées et où les personnes continuent de décider.", "L’IA trouve sa place dans un meilleur processus, pas au-dessus de l’ancien."], "p1": ["Parallèle", "", "Données et risques sont préparés en même temps.", "Le travail en parallèle retire l’attente du chemin critique."], "c4": ["Récupérer des données d’entreprise fiables", "Données fiables", "Des données gouvernées avec métadonnées, traçabilité, droits et définitions cohérentes.", "Pas de recherche : les données sont trouvables, fiables et accessibles."], "c5": ["Classification des risques IA", "Governance by design", "Une classification précoce en risque faible, moyen ou élevé détermine les contrôles.", "La gouvernance fait partie de la conception, pas une barrière finale."], "p2": ["Jonction"], "cg2": ["Niveau d’autonomie ?", "", "Le niveau de contrôle humain découle du risque et du contexte.", "Plus d’autonomie n’est pas toujours mieux : le niveau correspond au risque.", "L’humain décide · approuve · surveille · autonome dans un cadre"], "c7": ["Mobiliser une capacité IA / agent", "Capacité réutilisable", "L’agent utilise l’identité, les connaissances, les API, la supervision et les politiques existantes.", "Rien n’est reconstruit localement."], "c8": ["Déployer via la plateforme IA d’entreprise", " /* compile a flow into timeline items + static totals */
function compile(F){
  const N=F.nodes, items=[];
  const seg=(s)=>{const [a,b,lab,kind]=s;const pts=route(N[a],N[b],kind);return {from:a,to:b,lab,kind:kind||"",pts,len:plen(pts),lane:N[a].l!==N[b].l}};
  F.seq.forEach(s=>{
    if(s.par){items.push({par:s.par.map(br=>{const segs=br.map(seg);let cum=0;const pts=[];const checks=[];segs.forEach((g,i)=>{(i?g.pts.slice(1):g.pts).forEach(p=>pts.push(p));cum+=g.len;checks.push({node:g.to,at:cum})});
      return {segs,pts,len:cum,checks}}),join:s.par[0][s.par[0].length-1][1]})}
    else items.push(seg(s));
  });
  const T={dist:0,hand:0,wait:0,rework:0,gates:0,steps:0};
  const arrive=id=>{const n=N[id];if(n.t==="task")T.steps++;if(n.t==="xor"||n.t==="and")T.gates++;if(n.wait)T.wait++};
  items.forEach(it=>{
    if(it.par){T.dist+=Math.max(...it.par.map(b=>b.len));T.hand+=Math.max(...it.par.map(b=>b.segs.filter(g=>g.lane).length));
      it.par.forEach(b=>b.segs.forEach(g=>{if(g.to!==it.join)arrive(g.to)}));arrive(it.join)}
    else{T.dist+=it.len;if(it.lane)T.hand++;if(it.kind==="back")T.rework++;arrive(it.to)}
  });
  F.items=items;F.total=T;
  /* static edges */
  const seen=new Set(),edges=[];
  const add=(a,b,lab,kind)=>{const key=a+">"+b+">"+(kind||"");if(seen.has(key))return;seen.add(key);edges.push({a,b,lab,kind:kind||"",pts:route(N[a],N[b],kind)})};
  F.seq.forEach(s=>{if(s.par)s.par.forEach(br=>br.forEach(x=>add(...x)));else add(...s)});
  (F.extra||[]).forEach(x=>add(...x));
  F.edges=edges;
}

/* ---------------- simulation ---------------- */
const SPEED=700, DWELL=360, DWELL_GW=260;
function Sim(F,isMain){
  this.F=F;this.main=isMain;this.reset();
}
Sim.prototype.reset=function(){
  const F=this.F;this.i=0;this.phase="dwell";this.d=0;this.left=350;this.done=false;this.stepStop=false;
  this.m={dist:0,hand:0,wait:0,rework:0,gates:0,steps:0,time:0};this.kpi={};
  if(F.svg){F.trailG.innerHTML="";Object.values(F.el).forEach(g=>g.classList.remove("active","visited"));
    F.tokens.forEach((t,k)=>{if(k)t.remove()});F.tokens=[F.tokens[0]];const p=P(F.nodes.s0);F.tokens[0].setAttribute("cx",p.x);F.tokens[0].setAttribute("cy",p.y);F.tokens[0].setAttribute("class","token");
    this.activate("s0",true)}
};
Sim.prototype.activate=function(id,silent){
  const F=this.F;Object.values(F.el).forEach(g=>{if(g.classList.contains("active")){g.classList.remove("active");g.classList.add("visited")}});
  F.el[id].classList.add("active");
  const n=F.nodes[id];
  if(n.k)for(const k in n.k){this.kpi[k]=n.k[k];this.flash=k}
  this.cur=id;
  if(!silent){if(n.t==="task")this.m.steps++;if(n.t==="xor"||n.t==="and")this.m.gates++;if(n.wait)this.m.wait++}
  if(n.wait)F.tokens[0].classList.add("wait");else F.tokens[0].classList.remove("wait");
  ui.update();
};
Sim.prototype.trail=function(pts,back){el("path",{d:ptsD(pts),class:"trail"+(back?" back":"")},this.F.trailG)};
Sim.prototype.tick=function(dt){
  if(this.done)return;const F=this.F;this.m.time+=dt;
  if(this.phase==="dwell"){this.left-=dt*1000;if(this.left>0)return;
    if(this.i>=F.items.length){this.finish();return}
    const it=F.items[this.i];this.phase="move";this.d=0;
    if(it.par){F.tokens[0].setAttribute("class","token");it.par.forEach((b,k)=>{if(k)F.tokens.push(el("circle",{r:7,class:"token"},F.svg))});F.tokens[0].setAttribute("r",7);
      it._trails=it.par.map(b=>el("path",{d:"",class:"trail"},F.trailG));it._hit=it.par.map(()=>0);
      this.m.hand+=Math.max(...it.par.map(b=>b.segs.filter(g=>g.lane).length))}
    else{if(it.lane)this.m.hand++;if(it.kind==="back"){this.m.rework++;F.tokens[0].classList.add("back")}else F.tokens[0].classList.remove("back");F.tokens[0].classList.remove("wait");
      it._trail=el("path",{d:"",class:"trail"+(it.kind==="back"?" back":"")},F.trailG)}
    ui.update();return;
  }
  const it=F.items[this.i];this.d+=dt*SPEED;
  if(it.par){const L=Math.max(...it.par.map(b=>b.len));
    it.par.forEach((b,k)=>{const dd=Math.min(this.d,b.len),p=at(b.pts,dd);F.tokens[k].setAttribute("cx",p.x);F.tokens[k].setAttribute("cy",p.y);
      it._trails[k].setAttribute("d",ptsD(cut(b.pts,dd)));
      while(it._hit[k]<b.checks.length-1&&dd>=b.checks[it._hit[k]].at){const nid=b.checks[it._hit[k]].node;F.el[nid].classList.add("active");const n=F.nodes[nid];if(n.k)for(const kk in n.k){this.kpi[kk]=n.k[kk];this.flash=kk}if(n.t==="task")this.m.steps++;it._hit[k]++;this.lastPar=nid;ui.update()}});
    this.m.dist=this.base()+Math.min(this.d,L);
    if(this.d>=L){F.tokens.slice(1).forEach(t=>t.remove());F.tokens=[F.tokens[0]];F.tokens[0].setAttribute("r",10);const p=P(F.nodes[it.join]);F.tokens[0].setAttribute("cx",p.x);F.tokens[0].setAttribute("cy",p.y);
      this.arrive(it.join,L)}
  }else{const p=at(it.pts,Math.min(this.d,it.len));F.tokens[0].setAttribute("cx",p.x);F.tokens[0].setAttribute("cy",p.y);it._trail.setAttribute("d",ptsD(cut(it.pts,Math.min(this.d,it.len))));
    this.m.dist=this.base()+Math.min(this.d,it.len);
    if(this.d>=it.len)this.arrive(it.to,it.len)}
};
Sim.prototype.base=function(){let s=0;for(let k=0;k<this.i;k++){const it=this.F.items[k];s+=it.par?Math.max(...it.par.map(b=>b.len)):it.len}return s};
Sim.prototype.arrive=function(id,len){
  this.i++;this.phase="dwell";const n=this.F.nodes[id];
  this.left=n.dwell||((n.t==="xor"||n.t==="and")?DWELL_GW:DWELL);this.F.tokens[0].classList.remove("back");
  this.activate(id);if(this.stepStop){this.stepStop=false;ui.pause()}
};
Sim.prototype.finish=function(){this.done=true;this.F.tokens[0].classList.remove("wait");done[this.F.id]=true;ui.update();ui.checkUnlock();if(sims.every(s=>s.done||!s.live))ui.pause(true)};
function cut(pts,d){const out=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],L=Math.hypot(b.x-a.x,b.y-a.y);if(d>=L){out.push(b);d-=L}else{const r=L?d/L:0;out.push({x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r});break}}return out}

  const box=$("#travel-bars");box.querySelectorAll(".brow").forEach(e=>e.remove());
  const A=INC.total,B=COH.total;
  [["Procesafstand",U(A.dist),U(B.dist)],["Overdrachten tussen lanes",A.hand,B.hand],["Wachtmomenten",A.wait,B.wait],["Rework-lussen",A.rework,B.rework],["Beslispoorten",A.gates,B.gates],["Processtappen",A.steps,B.steps]].forEach(([l,x,y])=>{
    const mx=Math.max(x,y,1);const d=document.createElement("div");d.className="brow";
    d.innerHTML=`<div class="lbl"><span>${l}</span><b>${x} → ${y}</b></div><div class="btrack"><i class="inc" style="width:${x/mx*100}%"></i><i class="coh" style="width:${Math.max(y/mx*100,y?2:0)}%"></i></div>`;box.appendChild(d)});
}
function stopLoop(){cancelAnimationFrame(frameId);clearTimeout(motionTimer);frameId=motionTimer=0;last=0}
function scheduleLoop(){if(!running||document.hidden||frameId||motionTimer)return;if(motionPreference.matches)motionTimer=setTimeout(()=>loop(performance.now()),900);else frameId=requestAnimationFrame(loop)}
function loop(t){frameId=motionTimer=0;if(!running||document.hidden){last=0;return}const dt=motionPreference.matches?1e6:Math.min(.05,(t-last)/1000||0);last=t;sims.forEach(s=>s.tick(dt*speed));scheduleLoop()}
document.addEventListener("visibilitychange",()=>{stopLoop();if(!document.hidden)scheduleLoop()});
motionPreference.addEventListener("change",()=>{stopLoop();scheduleLoop()});

$("#b-play").addEventListener("click",()=>{if(sims.every(s=>s.done))sims.forEach(s=>s.reset());running=!running;setPlay()});
$("#b-step").addEventListener("click",()=>{if(sims.every(s=>s.done))return;sims.forEach(s=>s.stepStop=true);running=true;setPlay()});
$("#b-reset").addEventListener("click",()=>{running=false;sims.forEach(s=>s.reset());setPlay();ui.update()});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setView(t.dataset.view)));
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{speed=+b.dataset.speed;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));
$("#o-trail").addEventListener("change",applyOpts);$("#o-layers").addEventListener("change",applyOpts);
document.querySelector(".tabs").addEventListener("keydown",e=>{if(!["ArrowRight","ArrowLeft","Home","End"].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll(".tab")];let i=tabs.indexOf(document.activeElement);i=e.key==="Home"?0:e.key==="End"?tabs.length-1:(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;tabs[i].focus();tabs[i].click()});
function applyLang(l){LG=TX[l]?l:"en";document.documentElement.lang=LG;
  const labels={en:["Simulation","View","Speed"],nl:["Simulatie","Weergave","Snelheid"],fr:["Simulation","Vue","Vitesse"],de:["Simulation","Ansicht","Geschwindigkeit"]}[LG];document.querySelector(".toolbar")?.setAttribute("aria-label",labels[0]);document.querySelector(".tabs")?.setAttribute("aria-label",labels[1]);document.querySelector(".seg")?.setAttribute("aria-label",labels[2]);
  [INC,COH].forEach(F=>{const t=TX[LG][F.id];for(const id in t){const n=F.nodes[id],a=t[id];if(!n)continue;n.label=a[0];if(a.length>1){n.tag=a[1]||n.tag&&a[1];if(!a[1])delete n.tag;n.what=a[2];n.why=a[3]}if(a[4])n.note=a[4]}
    F.title=u(F.id+"_title");F.sub=u(F.id+"_sub")});
  document.querySelectorAll("[data-u]").forEach(e=>e.textContent=u(e.dataset.u));
  setView(view)}
applyLang(pickLang());
addEventListener("storage",e=>{if(e.key==="avs-lang"&&e.newValue&&e.newValue!==LG)applyLang(e.newValue)});
addEventListener("message",e=>{if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.type==="avs-lang"&&e.data.lang!==LG&&TX[e.data.lang])applyLang(e.data.lang)});
function postH(){if(parent!==window)parent.postMessage({type:"ec-sim-h",h:Math.ceil(document.body.getBoundingClientRect().height)+4},location.origin)}
new ResizeObserver(postH).observe(document.body);addEventListener("load",postH);
})();
</script>
